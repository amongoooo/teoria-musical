<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f5" />
    <meta name="description" content="Aprende teoría musical y producción en FL Studio con lecciones cortas e interactivas." />
    <!-- App instalable (PWA): manifiesto, íconos propios (public/iconos) y service worker (src/pwa/ + plugin swApp de vite.config.js) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/iconos/icono.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/iconos/favicon-64.png" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Teoría Musical" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Teoría Musical</title>
    <script>
      // Tema guardado en Opciones, aplicado antes de pintar (sin destello). Ver src/progress/opciones.js
      try {
        var t = (JSON.parse(localStorage.getItem('teoria-musical:opciones:v1') || '{}') || {}).tema
        if (t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#07080f')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
