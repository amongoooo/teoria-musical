<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f5" />
    <meta name="description" content="Aprende teoría musical y producción en FL Studio con lecciones cortas e interactivas." />
    <!-- App instalable (PWA): manifiesto, íconos propios (public/iconos) y service worker (src/pwa/ + plugin swApp de vite.config.js) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/iconos/icono.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/iconos/favicon-64.png" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Teoría Musical" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Teoría Musical</title>
    <script>
      // Tema y vidrio guardados en Opciones, aplicados antes de pintar (sin destello). Ver src/progress/opciones.js
      try {
        var o = JSON.parse(localStorage.getItem('teoria-musical:opciones:v1') || '{}') || {}
        if (o.vidrio === 'opaco') document.documentElement.classList.add('opaco')
        var t = o.tema
        var tel = matchMedia('(prefers-color-scheme: dark)').matches
        var osc = t === 'oscuro' || (t === 'sistema' && tel)
        if (t === 'programa') {
          // Igual que oscuroProgramado(): cada punto manda desde su hora hasta la del otro.
          var p = o.programa || {}, c = p.claro, k = p.oscuro, d = new Date(), m = d.getHours() * 60 + d.getMinutes()
          var ok = function (x) { return typeof x === 'number' && x >= 0 && x < 1440 }
          if (!ok(c) && !ok(k)) osc = tel
          else if (!ok(k)) osc = false
          else if (!ok(c)) osc = true
          else osc = (m - k + 1440) % 1440 < (c - k + 1440) % 1440
        }
        if (osc) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#07080f')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
